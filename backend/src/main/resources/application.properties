spring.application.name=backend

# Server Port Configuration
server.port=${PORT:8080}

# MongoDB Atlas Connection
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://studysync_user:<password>@cluster0.xxxxx.mongodb.net/studysync?retryWrites=true&w=majority}
spring.data.mongodb.database=studysync

# Allow cross-origin requests during testing
spring.web.resources.add-mappings=true